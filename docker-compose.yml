services:
  postgres:
    image: postgres:17
    container_name: arduino-iot-postgres

    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/migrations:/docker-entrypoint-initdb.d

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: arduino-iot-backend

    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: ${PORT}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}

    ports:
      - "3000:3000"

    depends_on:
      postgres:
        condition: service_healthy

  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile

    container_name: arduino-iot-simulator

    restart: unless-stopped

    environment:
      BACKEND_URL: http://backend:3000
      DEVICE_ID: ${SIMULATOR_DEVICE_ID}
      DEVICE_KEY: ${SIMULATOR_DEVICE_KEY}
      INTERVAL_MS: ${SIMULATOR_INTERVAL_MS:-2000}

    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data: